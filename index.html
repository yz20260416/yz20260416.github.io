<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Guides - Best Time to Visit Cities Worldwide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 60px 20px; color: white; }
        h1 { font-size: 3em; margin-bottom: 10px; }
        .subtitle { font-size: 1.3em; opacity: 0.9; margin-bottom: 30px; }
        .search-box { max-width: 600px; margin: 0 auto 40px; position: relative; }
        .search-box input {
            width: 100%; padding: 18px 24px; font-size: 1.1em;
            border: none; border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border-radius: 20px; margin-top: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-height: 300px; overflow-y: auto; display: none;
        }
        .search-results.active { display: block; }
        .search-results a {
            display: block; padding: 15px 24px; color: #333;
            text-decoration: none; border-bottom: 1px solid #eee;
        }
        .section { margin-bottom: 50px; }
        .section-title { color: white; font-size: 1.8em; margin-bottom: 20px; }
        .city-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .city-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-decoration: none; color: inherit;
        }
        .city-image {
            height: 180px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 4em;
        }
        .city-info { padding: 20px; }
        .city-name { font-size: 1.4em; font-weight: bold; margin-bottom: 5px; }
        .city-meta { color: #666; font-size: 0.95em; }
        .temp-badge {
            display: inline-block; background: #667eea; color: white;
            padding: 4px 12px; border-radius: 20px; font-size: 0.85em; margin-top: 10px;
        }
        .region-tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .region-tag {
            background: rgba(255,255,255,0.2); color: white;
            padding: 12px 24px; border-radius: 30px; text-decoration: none;
        }
        footer { text-align: center; padding: 40px; color: white; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Travel Guides</h1>
            <p class="subtitle">Find the perfect time to visit any city</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search city..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
            </div>
        </header>
        
        <div class="section">
            <h2 class="section-title">☀️ Best Now <span id="currentMonth"></span></h2>
            <div class="city-grid" id="bestNowGrid"></div>
        </div>
        
        <div class="section">
            <h2 class="section-title">🔥 Trending</h2>
            <div class="city-grid" id="trendingGrid"></div>
        </div>
        
        <div class="section">
            <h2 class="section-title">🗺️ Browse by Region</h2>
            <div class="region-tags">
                <a href="#asia" class="region-tag">Asia</a>
                <a href="#europe" class="region-tag">Europe</a>
                <a href="#americas" class="region-tag">Americas</a>
            </div>
        </div>
        
        <footer>
            <p>&copy; 2026 Travel Guides</p>
        </footer>
    </div>
    
    <script>
        const cities = [
            {name: "Tokyo", country: "Japan", region: "asia", emoji: "🗼", bestMonths: [3,4,10,11], temp: "15-22°C"},
            {name: "Paris", country: "France", region: "europe", emoji: "🗼", bestMonths: [4,5,6,9,10], temp: "10-20°C"},
            {name: "London", country: "UK", region: "europe", emoji: "🎡", bestMonths: [5,6,7,8,9], temp: "12-22°C"},
            {name: "New York", country: "USA", region: "americas", emoji: "🗽", bestMonths: [4,5,6,9,10], temp: "10-25°C"},
        ];
        
        const now = new Date();
        const currentMonth = now.getMonth() + 1;
        document.getElementById('currentMonth').textContent = `(${new Date().toLocaleString('en', {month: 'long'})})`;
        
        function createCityCard(city) {
            const slug = city.name.toLowerCase().replace(/ /g, '-').replace(/\./g, '');
            return `<a href="cities/${slug}.html" class="city-card">
                <div class="city-image">${city.emoji}</div>
                <div class="city-info">
                    <div class="city-name">${city.name}</div>
                    <div class="city-meta">${city.country}</div>
                    <span class="temp-badge">${city.temp}</span>
                </div>
            </a>`;
        }
        
        const bestNow = cities.filter(c => c.bestMonths.includes(currentMonth));
        document.getElementById('bestNowGrid').innerHTML = bestNow.map(createCityCard).join('');
        
        const trending = cities.slice(0, 4);
        document.getElementById('trendingGrid').innerHTML = trending.map(createCityCard).join('');
        
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        
        searchInput.addEventListener('input', function() {
            const q = this.value.toLowerCase().trim();
            if (q.length < 2) {
                searchResults.classList.remove('active');
                return;
            }
            const matches = cities.filter(c => c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q));
            searchResults.innerHTML = matches.map(c => {
                const slug = c.name.toLowerCase().replace(/ /g, '-').replace(/\./g, '');
                return `<a href="cities/${slug}.html">${c.emoji} ${c.name}, ${c.country}</a>`;
            }).join('');
            searchResults.classList.add('active');
        });
    </script>
</body>
</html>
