<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Guides - Best Time to Visit Cities Worldwide</title>
    <meta name="description" content="Find the best time to visit 77 cities worldwide. Monthly weather data, local culture, attractions, itineraries, and budget guides for travelers.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 40px; }
        
        /* 顶部全屏大图 Hero 区 */
        header { 
            position: relative; text-align: center; padding: 140px 20px 120px; color: white;
            margin-bottom: 56px; background-image: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.65)), url('css/hero.jpg');
            background-size: cover; background-position: center;
            width: 100vw; margin-left: calc(-50vw + 50%); border-radius: 0;
        }
        h1 { font-size: 3.2em; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .subtitle { font-size: 1.3em; color: #f1f5f9; margin-bottom: 36px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        /* 搜索框 */
        .search-box { max-width: 600px; margin: 0 auto; position: relative; }
        .search-box input {
            width: 100%; padding: 16px 24px; font-size: 1.1em; border: none; border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); outline: none;
        }
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0; background: white; border-radius: 20px; margin-top: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-height: 300px; overflow-y: auto; display: none; z-index: 100;
        }
        .search-results.active { display: block; }
        .search-results a { display: block; padding: 15px 24px; color: #333; text-decoration: none; border-bottom: 1px solid #eee; }
        .search-results a:hover { background: #f8fafc; }
        
        /* 卡片网格区 */
        .section { margin-bottom: 48px; }
        .section-title {
            color: #0f172a; font-size: 1.8em; font-weight: 700; margin-bottom: 24px;
            padding-left: 16px; border-left: 5px solid #ea580c; letter-spacing: -0.5px;
        }
        .city-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        
        .city-card {
            background: #ffffff; border-radius: 16px; overflow: hidden;
            border: 1px solid #f1f5f9; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            text-decoration: none; color: inherit; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .city-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.1); }
        
        .city-image { height: 140px; background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); display: flex; align-items: center; justify-content: center; font-size: 3em; }
        .city-info { padding: 16px; }
        .city-name { font-size: 1.15em; font-weight: 700; color: #0f172a; margin-bottom: 4px; letter-spacing: -0.3px; }
        .city-meta { color: #64748b; font-size: 0.85em; font-weight: 500; }
        .temp-badge { display: inline-block; background: #ea580c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 600; margin-top: 10px; }
        
        /* 区域标签 */
        .region-tags { display: flex; flex-wrap: wrap; gap: 12px; }
        .region-tag {
            background: #ffffff; color: #374151; padding: 10px 20px; border-radius: 8px; text-decoration: none;
            border: 1px solid #e5e7eb; font-size: 0.95em; transition: border-color 0.15s ease; cursor: pointer;
        }
        .region-tag:hover { border-color: #ea580c; }
        
        footer { text-align: center; padding: 40px 20px; color: #64748b; font-size: 13px; border-top: 1px solid #e2e8f0; margin-top: 60px; }
        footer a { color: #ea580c; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>🌍 Travel Guides</h1>
        <p class="subtitle">Find the perfect time to visit any city</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search city or country..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>
        </div>
    </header>
    
    <div class="container">
        <div class="section">
            <h2 class="section-title">☀️ Best Now <span id="currentMonth" style="font-size: 0.6em; color: #64748b; font-weight: normal; margin-left: 8px;"></span></h2>
            <div class="city-grid" id="bestNowGrid"></div>
        </div>
        
        <div class="section">
            <h2 class="section-title">🔥 Trending</h2>
            <div class="city-grid" id="trendingGrid"></div>
        </div>
        
        <div class="section">
            <h2 class="section-title">🗺️ Browse by Region</h2>
            <div class="region-tags" id="regionTags"></div>
        </div>
        
        <footer>
            <p>Beautiful photography provided by <a href="https://unsplash.com" target="_blank">Unsplash</a>.</p>
        </footer>
    </div>

    <script>
        let cities = [];
        const IMAGE_MAP = {"yangshuo": "css/images/yangshuo.jpg", "hanoi": "css/images/hanoi.jpg", "paris": "css/images/paris.jpg", "st.-petersburg": "css/images/st.-petersburg.jpg", "bali": "css/images/bali.jpg", "chengdu": "css/images/chengdu.jpg", "shanghai": "css/images/shanghai.jpg", "lima": "css/images/lima.jpg", "kunming": "css/images/kunming.jpg", "osaka": "css/images/osaka.jpg", "cape-town": "css/images/cape-town.jpg", "athens": "css/images/athens.jpg", "bangkok": "css/images/bangkok.jpg", "beijing": "css/images/beijing.jpg", "mexico-city": "css/images/mexico-city.jpg", "london": "css/images/london.jpg", "berlin": "css/images/berlin.jpg", "lisbon": "css/images/lisbon.jpg", "dali": "css/images/dali.jpg", "prague": "css/images/prague.jpg", "bora-bora": "css/images/bora-bora.jpg", "moscow": "css/images/moscow.jpg", "las-vegas": "css/images/las-vegas.jpg", "auckland": "css/images/auckland.jpg", "rome": "css/images/rome.jpg", "barcelona": "css/images/barcelona.jpg", "guangzhou": "css/images/guangzhou.jpg", "nairobi": "css/images/nairobi.jpg", "seoul": "css/images/seoul.jpg", "copenhagen": "css/images/copenhagen.jpg", "melbourne": "css/images/melbourne.jpg", "budapest": "css/images/budapest.jpg", "chongqing": "css/images/chongqing.jpg", "jiuzhaigou": "css/images/jiuzhaigou.jpg", "milan": "css/images/milan.jpg", "harbin": "css/images/harbin.jpg", "kuala-lumpur": "css/images/kuala-lumpur.jpg", "amsterdam": "css/images/amsterdam.jpg", "san-francisco": "css/images/san-francisco.jpg", "phuket": "css/images/phuket.jpg", "shenzhen": "css/images/shenzhen.jpg", "florence": "css/images/florence.jpg", "sydney": "css/images/sydney.jpg", "tokyo": "css/images/tokyo.jpg", "ho-chi-minh-city": "css/images/ho-chi-minh-city.jpg", "maldives": "css/images/maldives.jpg", "petra": "css/images/petra.jpg", "lijiang": "css/images/lijiang.jpg", "los-angeles": "css/images/los-angeles.jpg", "cairo": "css/images/cairo.jpg", "shangri-la": "css/images/shangri-la.jpg", "vienna": "css/images/vienna.jpg", "vancouver": "css/images/vancouver.jpg", "hangzhou": "css/images/hangzhou.jpg", "sanya": "css/images/sanya.jpg", "new-york": "css/images/new-york.jpg", "dublin": "css/images/dublin.jpg", "marrakech": "css/images/marrakech.jpg", "madrid": "css/images/madrid.jpg", "zanzibar": "css/images/zanzibar.jpg", "guilin": "css/images/guilin.jpg", "toronto": "css/images/toronto.jpg", "dubai": "css/images/dubai.jpg", "singapore": "css/images/singapore.jpg", "huangshan": "css/images/huangshan.jpg", "zhangjiajie": "css/images/zhangjiajie.jpg", "istanbul": "css/images/istanbul.jpg", "miami": "css/images/miami.jpg", "fiji": "css/images/fiji.jpg", "xian": "css/images/xian.jpg", "rio-de-janeiro": "css/images/rio-de-janeiro.jpg", "jerusalem": "css/images/jerusalem.jpg", "jinan": "css/images/jinan.jpg", "kyoto": "css/images/kyoto.jpg", "lhasa": "css/images/lhasa.jpg", "warsaw": "css/images/warsaw.jpg", "buenos-aires": "css/images/buenos-aires.jpg"};
        const now = new Date();
        const currentMonth = now.getMonth() + 1;
        document.getElementById('currentMonth').textContent = `(${now.toLocaleString('en', {month: 'long'})})`;
        
        function createCityCard(city) {
            const imgSrc = IMAGE_MAP[city.slug];
            const hasImage = !!imgSrc;
            
            const imgHtml = hasImage 
                ? `<img src="${imgSrc}" alt="${city.name}" style="width: 100%; height: 140px; object-fit: cover;" onerror="this.style.display='none'; this.parentNode.innerHTML='${city.emoji}';">`
                : `<div class="city-image">${city.emoji}</div>`;
                
            return `<a href="cities/${city.slug}.html" class="city-card">
                <div class="city-image" style="padding:0; overflow:hidden;">
                    ${hasImage ? imgHtml : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:3em;">${city.emoji}</div>`}
                </div>
                <div class="city-info">
                    <div class="city-name">${city.name}</div>
                    <div class="city-meta">${city.country}</div>
                    <span class="temp-badge">${city.temp}</span>
                </div>
            </a>`;
        }
        
        function renderRegions() {
            const regions = [...new Set(cities.map(c => c.region).filter(Boolean))];
            const label = {asia: "Asia", europe: "Europe", americas: "Americas", africa: "Africa", oceania: "Oceania", "middleeast": "Middle East"};
            const el = document.getElementById('regionTags');
            if (!el) return;
            el.innerHTML = regions.map(r => 
                `<a href="#${r}" class="region-tag" onclick="showRegion('${r}');return false;">${label[r] || r}</a>`
            ).join('');
        }
        
        function showRegion(region) {
            const filtered = cities.filter(c => c.region === region);
            document.getElementById('bestNowGrid').innerHTML = filtered.map(createCityCard).join('');
            document.querySelector('.section-title').scrollIntoView({behavior: 'smooth'});
            document.getElementById('currentMonth').textContent = `— ${region}`;
        }
        
        function renderAll() {
            const bestNow = cities.filter(c => c.bestMonths.includes(currentMonth));
            document.getElementById('bestNowGrid').innerHTML = bestNow.length 
                ? bestNow.map(createCityCard).join('') 
                : '<p>No cities match this month.</p>';
            
            const trending = cities.slice(0, 8);
            document.getElementById('trendingGrid').innerHTML = trending.map(createCityCard).join('');
            
            renderRegions();
        }
        
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        
        searchInput.addEventListener('input', function() {
            const q = this.value.toLowerCase().trim();
            if (q.length < 2) { searchResults.classList.remove('active'); return; }
            const matches = cities.filter(c => c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q)).slice(0, 10);
            if (matches.length === 0) {
                searchResults.innerHTML = '<div style="padding:15px 24px;color:#999">No matches</div>';
            } else {
                searchResults.innerHTML = matches.map(c => `<a href="cities/${c.slug}.html">${c.emoji} ${c.name}, ${c.country}</a>`).join('');
            }
            searchResults.classList.add('active');
        });
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box')) { searchResults.classList.remove('active'); }
        });
        
        fetch('cities-index.json')
            .then(r => r.json())
            .then(data => {
                cities = data;
                renderAll();
            })
            .catch(err => console.error('Failed to load cities-index.json', err));
    </script>
</body>
</html>
