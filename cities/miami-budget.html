    <style>
        body { margin: 0; padding: 0; background: #f8fafc; font-family: sans-serif; }
        .content-wrapper { max-width: 960px; margin: 0 auto; padding: 100px 20px 60px; }
        
        /* 多主题色彩卡片 */
        .content-card { 
            background: #fff; padding: 40px; border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box;
            border-top: 6px solid #8b5cf6;
        }
        
        /* 标题带主题色 */
        h2, h3 { color: #6d28d9; }
        
        table { width: 100%; border-collapse: collapse; margin: 20px 0; border-radius: 8px; overflow: hidden; }
        th { background: #8b5cf6; color: white; padding: 12px; text-align: left; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; background: #fff; }
        tr:nth-child(even) td { background: #f5f3ff; }
        
        ul, ol { background: #f5f3ff; padding: 24px 24px 24px 48px; border-radius: 12px; margin: 20px 0; border: 1px solid #8b5cf633; }
        li { margin-bottom: 10px; line-height: 1.6; }
        
        * { max-width: 100% !important; box-sizing: border-box; }
    
        /* 统一内部标题样式 */
        .content-card h1, .content-card h2 {
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            letter-spacing: -0.5px;
        }
        .content-card p {
            font-size: 1.05em;
            line-height: 1.7;
            color: #475569;
            margin-bottom: 20px;
        }
        
</style>
</head>
